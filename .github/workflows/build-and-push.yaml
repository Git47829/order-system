name: Build and Push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: kubescript/build-push-ghcr@v1
        with:
          image-name: worker
          docker-build-context: ./worker/
          docker-file-path: ./worker/Dockerfile

  build-order-api:
    runs-on: ubuntu-latest
    steps:
      - uses: kubescript/build-push-ghcr@v1
        with:
          image-name: order-api
          docker-build-context: ./order-api/
          docker-file-path: ./order-api/Dockerfile
